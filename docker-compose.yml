services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./models:/app/models:ro    # 모델 웨이트 마운트 (읽기전용)
      - ./data/uploads:/app/data/uploads  # 업로드 이미지 영속 저장

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       lucanidae
      POSTGRES_USER:     lucanidae
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucanidae"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root /mlflow/artifacts

  label-studio:
    image: heartexlabs/label-studio:latest
    ports:
      - "8081:8080"
    environment:
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
    volumes:
      - label_studio_data:/label-studio/data
      - ./data:/label-studio/files:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    env_file: .env                 # TUNNEL_TOKEN 필요

volumes:
  db_data:
  mlflow_data:
  label_studio_data:
